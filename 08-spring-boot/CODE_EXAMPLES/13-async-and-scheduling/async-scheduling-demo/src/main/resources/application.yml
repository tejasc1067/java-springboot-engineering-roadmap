spring:
  task:
    execution:
      thread-name-prefix: report-   # Boot's default is "task-"
      pool:
        core-size: 4
        max-size: 4
        queue-capacity: 100         # Boot's default queue is unbounded: a flood of tasks piles up in memory
    scheduling:
      thread-name-prefix: scheduler-
      pool:
        size: 1                     # Boot's default: ONE thread runs every @Scheduled method
