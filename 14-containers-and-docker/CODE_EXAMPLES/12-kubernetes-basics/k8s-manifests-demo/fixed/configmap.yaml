# Non-secret settings, injected as environment variables. Spring Boot maps SPRING_DATASOURCE_URL
# to spring.datasource.url (relaxed binding, module 08 topic 05).
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://orders-db:5432/orders"
  SPRING_DATASOURCE_USERNAME: "orders"
